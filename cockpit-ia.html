<style>
:root{--bg:#0a0e15;--panel:#121927;--panel2:#0e1420;--line:rgba(196,113,79,.16);

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
.serif{font-family:'Fraunces',serif}.mono{font-family:'JetBrains Mono',monospace}
.layout{display:grid;grid-template-columns:248px 1fr;height:100vh}
/* sidebar */
.side{background:#0c121d;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#C4714F,#e69a76);display:grid;place-items:center;font-size:18px;color:#1a0f08;font-weight:800}
.brand b{font-size:15px}.brand span{display:block;color:var(--mut);font-size:11px}
.nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav::-webkit-scrollbar{width:7px}.nav::-webkit-scrollbar-thumb{background:#222c3d;border-radius:7px}
.nl{font-size:10.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.6px;padding:10px 10px 6px;font-weight:700}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.item:hover{background:#121927}
.item.on{background:#161f2e;border-color:var(--line)}
.item .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:15px;flex:none}
.item b{font-size:13px;font-weight:600}.item span{display:block;color:var(--mut2);font-size:10.5px}
.item .pin{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--green)}
/* main */
.main{min-height:0;overflow-y:auto;padding:22px 26px 60px}
.main::-webkit-scrollbar{width:9px}.main::-webkit-scrollbar-thumb{background:#222c3d;border-radius:9px}
.ah{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.ah .big{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:27px;flex:none}
.ah h1{font-size:24px;font-weight:800}.ah .role{color:var(--mut);font-size:13.5px}
.watch{margin-left:auto;font-size:11.5px;color:#7ee2a8;display:inline-flex;align-items:center;gap:6px;font-weight:700;background:#10241a;border:1px solid rgba(34,197,94,.3);padding:6px 12px;border-radius:30px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.mission{color:var(--mut);font-size:13.5px;line-height:1.55;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:14px 0 18px}
.mission b{color:var(--orange-b)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--ac,#C4714F)}
.kpi .n{font-size:21px;font-weight:800;line-height:1.05;letter-spacing:-.5px}
.kpi .l{font-size:11.5px;color:var(--mut);margin-top:5px}
.kpi.red .n{color:#f3a79c}.kpi.grn .n{color:#7ee2a8}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px}
.tcard .th{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.tcard .th .cnt{margin-left:auto;font-size:11px;color:var(--mut);font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut2);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;padding:10px 14px;border-bottom:1px solid #1b2230;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #141b27;color:var(--ink)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#10151f}
td.money{font-family:'JetBrains Mono',monospace;font-weight:600;white-space:nowrap}
td.red{color:#f3a79c;font-weight:700}td.grn{color:#7ee2a8}td.mut{color:var(--mut)}
.pill{font-size:10.5px;padding:2px 8px;border-radius:20px;background:#0e1420;border:1px solid #232c3d;color:var(--mut)}
.empty{padding:30px;text-align:center;color:var(--mut2);font-size:13px}
/* chat (salon) */
.feed{display:flex;flex-direction:column;gap:12px;max-width:840px}
.msg{display:flex;gap:11px}.msg.boss .bubble{background:linear-gradient(180deg,rgba(196,113,79,.16),rgba(196,113,79,.05));border-color:rgba(196,113,79,.4)}
.msg.you .bubble{background:linear-gradient(180deg,rgba(34,197,94,.13),rgba(34,197,94,.04));border-color:rgba(34,197,94,.4)}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
.bubble{background:var(--panel2);border:1px solid #1b2230;border-radius:4px 13px 13px 13px;padding:9px 13px;max-width:82%}
.who{display:flex;align-items:center;gap:8px;margin-bottom:3px}.who b{font-size:12.5px}.who .tm{font-size:10px;color:var(--mut2)}
.ordre{display:inline-block;font-size:9.5px;font-weight:800;color:#1a0f08;background:var(--orange-b);padding:2px 7px;border-radius:20px;margin-bottom:5px}
.txt{font-size:13.4px;line-height:1.5}.txt .k{color:var(--orange-b);font-weight:700}.txt .r{color:#f3a79c;font-weight:700}.txt .g{color:#7ee2a8;font-weight:700}
.hint{color:var(--mut2);font-size:12px;margin-top:8px}
</style>

/* ---- helpers de rendu ---- */
function kpiHTML(list,c){return '<div class="kpis">'+list.map(function(k){
  return '<div class="kpi '+(k.cls||'')+'" style="--ac:'+c+'"><div class="n">'+esc(k.n)+'</div><div class="l">'+esc(k.l)+'</div></div>';}).join('')+'</div>';}
function table(title,cols,rows){
  if(!rows||!rows.length)return '';
  var head='<tr>'+cols.map(function(c){return '<th>'+esc(c.label)+'</th>';}).join('')+'</tr>';
  var body=rows.map(function(r){return '<tr>'+cols.map(function(c){
     var v=r[c.k]; if(c.money)return '<td class="money '+(c.cls||'')+'">'+fmt(v)+'</td>';
     if(c.num)return '<td class="money">'+num(v)+'</td>';
     return '<td class="'+(c.cls||'')+'">'+esc(v)+'</td>';}).join('')+'</tr>';}).join('');
  return '<div class="tcard"><div class="th">'+esc(title)+'<span class="cnt">'+rows.length+' lignes</span></div>'+
    '<div class="tw"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div>';
}
function header(a,extra){
 return '<div class="ah"><div class="big" style="background:'+a.c+'22">'+a.em+'</div>'+
  '<div><h1>'+esc(a.nom)+'</h1><div class="role">'+esc(a.role)+'</div></div>'+
  (a.id!=='overview'&&a.id!=='salon'?'<span class="watch"><span class="dot"></span>en surveillance</span>':'')+'</div>'+
  (a.mission?'<div class="mission">'+a.mission+'</div>':'')+(extra||'');
}

   return header(a)+kpiHTML([{n:(APP.topArt[0]||{}).nom||'—',l:'best-seller'},{n:num((APP.topArt[0]||{}).q||0),l:'vendus'},{n:num(S.total),l:'commandes'},{n:'2/j',l:'posts proposés'}],a.c)+
     table('Best-sellers à mettre en avant',[{k:'nom',label:'Produit'},{k:'q',label:'Vendus',num:1}],APP.topArt)+
     table('Dernières commandes (matière à contenu)',[{k:'client',label:'Client'},{k:'date',label:'Date',cls:'mut'},{k:'total',label:'Montant',money:1}],APP.recent.slice(0,8));
 }
 if(id==='rh'){
   return header(a)+kpiHTML([{n:S.salaries,l:'salariés'},{n:F.masse,l:'masse salariale/mois'},{n:S.ateliers,l:'ateliers pourvus'},{n:'60 DH',l:'coût horaire moyen'}],a.c)+
     table('Effectif & salaires',[{k:'n',label:'Nom'},{k:'poste',label:'Poste',cls:'mut'},{k:'atelier',label:'Atelier'},{k:'sal',label:'Salaire',money:1},{k:'coutH',label:'Coût/h',num:1}],APP.salaries);
 }
 if(id==='ateliers'){
   return header(a)+kpiHTML([{n:S.ateliers,l:'ateliers'},{n:S.salaries,l:'effectif total'},{n:'60 DH',l:'coût/h moyen'},{n:S.enAttente,l:'à répartir'}],a.c)+
     table('Les 9 ateliers',[{k:'code',label:'Code'},{k:'nom',label:'Atelier'},{k:'chef',label:'Chef',cls:'mut'},{k:'effectif',label:'Effectif',num:1},{k:'coutH',label:'Coût horaire',num:1}],APP.ateliers);
 }
 return header(a)+'<div class="empty">En construction.</div>';
}

/* ---- salon (chat live) ---- */
var chatTimer=null;
function startSalon(){
 var team={'Patron IA':{em:'🧠',c:'#C4714F'},'Le Veilleur':{em:'⚠️',c:'#E74C3C'},'Finance':{em:'💰',c:'#EAB308'},
  'Production':{em:'🏭',c:'#3b82f6'},'Coût de revient':{em:'🧮',c:'#34d399'},'Achats':{em:'📦',c:'#a78bfa'},
  'Planning':{em:'📅',c:'#06b6d4'},'Commercial':{em:'👥',c:'#e69a76'},'Marketing':{em:'📣',c:'#f59e0b'},'Service client':{em:'💬',c:'#60a5fa'}};
 function build(cy){
  var i1=pick(APP.finance,cy),i2=pick(APP.finance,cy+1),gr=pick(APP.gros,cy),pe=pick(APP.production,cy),ar=pick(APP.topArt,cy),vt=APP.vendeurs[0]||{v:'—'};
  return [
   {a:'Patron IA',boss:1,o:'BRIEFING',m:'Analyse — '+num(APP.stats.total)+' commandes, encaissé seulement <span class="r">'+APP.fmt.paye+'</span> sur '+APP.fmt.ca+'. Vos points.'},
   {a:'Finance',m:'Plus gros impayé : <span class="r">'+esc(i1.client)+' — '+fmt(i1.reste)+'</span> (vente '+esc(i1.vendeur)+'). Total dû : '+APP.fmt.reste+'.'},
   {a:'Production',m:'<span class="k">'+APP.stats.enAttente+' en attente</span>. La plus vieille : '+esc(pe.client)+' ('+esc(pe.date)+', '+fmt(pe.total)+').'},
   {a:'Patron IA',boss:1,o:'ORDRE',m:'Finance → relance <span class="k">'+esc(i1.client)+'</span> puis '+esc(i2.client)+'. Production → lance '+esc(pe.client)+' (déjà payée ?).'},
   {a:'Coût de revient',m:'Je sécurise la marge de <span class="k">'+esc(gr.client)+'</span> ('+fmt(gr.total)+') avant lancement.'},
   {a:'Achats',m:'Best-seller à approvisionner : '+esc(ar.nom)+' ('+ar.q+' vendus). Je compare 2 fournisseurs.'},
   {a:'Marketing',m:'Je pousse <span class="k">'+esc(ar.nom)+'</span> en pub aujourd\'hui pour remplir le carnet.'},
   {a:'Patron IA',boss:1,you:1,m:'Driss : <span class="k">'+esc(i1.client)+'</span> ('+fmt(i1.reste)+') demande un délai. Je propose un échéancier 3x. Tu valides ?'}
  ];
 }
 var feed=document.getElementById('feed'); if(!feed)return;
 var cycle=0,script=build(0),i=0;
 function bubble(it){var t=team[it.a]||{em:'•',c:'#888'};var el=document.createElement('div');
   el.className='msg'+(it.boss?' boss':'')+(it.you?' you':'');
   el.innerHTML='<div class="av" style="background:'+t.c+'22">'+t.em+'</div><div class="bubble">'+
    (it.o?'<div class="ordre">'+it.o+'</div>':'')+'<div class="who"><b>'+it.a+'</b></div><div class="txt">'+it.m+'</div></div>';
   feed.appendChild(el);feed.scrollTop=feed.scrollHeight;}
 function step(){ if(!document.getElementById('feed'))return;
   if(i>=script.length){chatTimer=setTimeout(function(){feed.innerHTML='';cycle++;script=build(cycle);i=0;step();},5500);return;}
   bubble(script[i++]); chatTimer=setTimeout(step,1100);}
 feed.innerHTML=''; step();
}

/* ---- routeur ---- */
function show(id){
 if(chatTimer){clearTimeout(chatTimer);chatTimer=null;}
 document.querySelectorAll('.item').forEach(function(el){el.classList.toggle('on',el.getAttribute('data-id')===id);});
 document.getElementById('main').innerHTML=content(id);
 document.getElementById('main').scrollTop=0;
 if(id==='salon')startSalon();
}
show('overview');
</script>
