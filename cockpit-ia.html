<style>
:root{--bg:#0a0e15;--panel:#121927;--panel2:#0e1420;--line:rgba(196,113,79,.16);

 --ink:#ece9e3;--mut:#8d96a5;--mut2:#586273}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
.serif{font-family:'Fraunces',serif}.mono{font-family:'JetBrains Mono',monospace}
.layout{display:grid;grid-template-columns:226px 1fr 340px;height:100vh}
/* sidebar */
.side{background:#0c121d;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:15px;border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#C4714F,#e69a76);display:grid;place-items:center;font-size:17px;color:#1a0f08;font-weight:800}
.brand b{font-size:14px}.brand span{display:block;color:var(--mut);font-size:10.5px}
.nav{flex:1;overflow-y:auto;padding:9px 8px}
.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:#222c3d;border-radius:6px}
.nl{font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.6px;padding:9px 9px 5px;font-weight:700}
.item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.item:hover{background:#121927}.item.on{background:#161f2e;border-color:var(--line)}
.item .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:14px;flex:none}
.item b{font-size:12.5px;font-weight:600}.item span{display:block;color:var(--mut2);font-size:10px}
.item .pin{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--green)}
/* center */
.main{min-height:0;overflow-y:auto;padding:20px 24px 50px}
.main::-webkit-scrollbar{width:8px}.main::-webkit-scrollbar-thumb{background:#222c3d;border-radius:8px}
.ah{display:flex;align-items:center;gap:13px;margin-bottom:6px}
.ah .big{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:25px;flex:none}
.ah h1{font-size:22px;font-weight:800}.ah .role{color:var(--mut);font-size:13px}
.watch{margin-left:auto;font-size:11px;color:#7ee2a8;display:inline-flex;align-items:center;gap:6px;font-weight:700;background:#10241a;border:1px solid rgba(34,197,94,.3);padding:5px 11px;border-radius:30px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.mission{color:var(--mut);font-size:13px;line-height:1.55;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:13px 0 16px}
.mission b{color:var(--orange-b)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 14px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--ac,#C4714F)}
.kpi .n{font-size:19px;font-weight:800;line-height:1.05;letter-spacing:-.5px}
.kpi .l{font-size:11px;color:var(--mut);margin-top:5px}
.kpi.red .n{color:#f3a79c}.kpi.grn .n{color:#7ee2a8}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;margin-bottom:16px}
.tcard .th{padding:12px 15px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px}
.tcard .th .cnt{margin-left:auto;font-size:10.5px;color:var(--mut);font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--mut2);font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;padding:9px 13px;border-bottom:1px solid #1b2230;white-space:nowrap}
td{padding:9px 13px;border-bottom:1px solid #141b27;color:var(--ink)}
tr:last-child td{border-bottom:none}tr:hover td{background:#10151f}
td.money{font-family:'JetBrains Mono',monospace;font-weight:600;white-space:nowrap}
td.red{color:#f3a79c;font-weight:700}td.grn{color:#7ee2a8}td.mut{color:var(--mut)}
/* SALON (toujours visible à droite) */
.salon{background:#0c121d;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}

.msg{display:flex;gap:9px;animation:in .35s ease}

.msg.boss .bubble{background:linear-gradient(180deg,rgba(196,113,79,.16),rgba(196,113,79,.05));border-color:rgba(196,113,79,.4)}
.msg.you .bubble{background:linear-gradient(180deg,rgba(34,197,94,.13),rgba(34,197,94,.04));border-color:rgba(34,197,94,.4)}

.bubble{background:var(--panel2);border:1px solid #1b2230;border-radius:3px 12px 12px 12px;padding:8px 11px;max-width:84%}
.who{display:flex;align-items:center;gap:7px;margin-bottom:3px}.who b{font-size:11.5px}
.ordre{display:inline-block;font-size:9px;font-weight:800;color:#1a0f08;background:var(--orange-b);padding:2px 7px;border-radius:20px;margin-bottom:4px}
.txt{font-size:12.3px;line-height:1.45}.txt .k{color:var(--orange-b);font-weight:700}.txt .r{color:#f3a79c;font-weight:700}.txt .g{color:#7ee2a8;font-weight:700}
.btns{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.btn{font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;border:1px solid #2a3445;background:#0e1420;color:var(--mut)}
.btn.y{background:rgba(34,197,94,.15);color:#7ee2a8;border-color:rgba(34,197,94,.35)}
.typing{display:flex;gap:9px;align-items:center}
.tdots{background:var(--panel2);border:1px solid #1b2230;border-radius:12px;padding:9px 12px;display:flex;gap:4px}
.tdots i{width:5px;height:5px;border-radius:50%;background:var(--mut2);animation:bl 1.2s infinite}
.tdots i:nth-child(2){animation-delay:.2s}.tdots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.chatbar{flex:none;border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;background:#0c121d}

.chatbar button{background:var(--orange);color:#1a0f08;border:none;border-radius:10px;padding:0 14px;font-weight:800;font-size:15px;cursor:pointer}
.hintq{padding:0 13px 10px;display:flex;gap:6px;flex-wrap:wrap}
.hintq span{font-size:10.5px;color:var(--mut);background:var(--panel2);border:1px solid #232c3d;border-radius:20px;padding:4px 9px;cursor:pointer}
.hintq span:hover{border-color:var(--orange);color:var(--orange-b)}
.mtog{display:none}

 .salon.open{transform:none}.item b,.item span,.nl,.brand b,.brand span{display:none}.item{justify-content:center}.item .pin{display:none}
 .mtog{display:flex;position:fixed;right:14px;bottom:14px;z-index:30;background:var(--orange);color:#1a0f08;border:none;border-radius:30px;padding:12px 16px;font-weight:800;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);align-items:center;gap:7px;cursor:pointer}}

function table(title,cols,rows){if(!rows||!rows.length)return '';

  var body=rows.map(function(r){return '<tr>'+cols.map(function(c){var v=r[c.k];
     if(c.money)return '<td class="money '+(c.cls||'')+'">'+fmt(v)+'</td>';

     return '<td class="'+(c.cls||'')+'">'+esc(v)+'</td>';}).join('')+'</tr>';}).join('');
  return '<div class="tcard"><div class="th">'+esc(title)+'<span class="cnt">'+rows.length+' lignes</span></div><div class="tw"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div>';}

   table('Produits les plus commandés (depuis les commandes)',[{k:'nom',label:'Article'},{k:'q',label:'Quantité',num:1}],APP.topArt);
 return header(a);
}
function show(id){document.querySelectorAll('.item').forEach(function(el){el.classList.toggle('on',el.getAttribute('data-id')===id);});var m=document.getElementById('main');m.innerHTML=content(id);m.scrollTop=0;if(id==='rentabilite')setTimeout(function(){analyseRenta(false);},200);}

/* ===== AGENT RENTABILITÉ : lit la page /dispatch du MES, analyse chaque jour ===== */
function aujKey(){var d=new Date();return 'renta_'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function rentaLocale(){
 // Estimation de marge à partir des commandes (repli si /dispatch indisponible)
 var ca=APP.raw.ca, masse=221300;
 var panier=APP.raw.ca/APP.stats.total;
 // marge brute estimée : on suppose ~55% de coût matière+MO sur le CA (ordre de grandeur, à affiner par /dispatch)
 var margeEst=Math.round(ca*0.45);
 var top=APP.gros.slice(0,3).map(function(o){return o.client+' ('+fmt(o.total)+')';}).join(', ');
 return '⚠️ <b>Page /dispatch pas encore lisible en direct</b> (accessible une fois l\'app en ligne avec la fonction <code>/api/rentabilite</code>).<br>'+
  'En attendant, voici mon <b>estimation</b> sur tes '+APP.stats.total+' commandes :<br><br>'+
  '• CA total : <b>'+fmt(ca)+'</b><br>'+
  '• Panier moyen : <b>'+fmt(panier)+'</b>/commande<br>'+
  '• Marge brute estimée (~45%) : <span class="g">'+fmt(margeEst)+'</span> <span style="color:var(--mut2)">(ordre de grandeur — affiné par /dispatch)</span><br>'+
  '• Charges salariales : '+fmt(masse)+'/mois<br>'+
  '• Plus gros tickets : '+top+'<br><br>'+
  '<span style="color:var(--mut2)">👉 Quand l\'app sera en ligne, je lirai les vrais coûts de ta page /dispatch et je te donnerai la marge EXACTE par commande, chaque jour.</span>';
}
function rentaFromDispatch(d){
 // d = données réelles de la page /dispatch (format inconnu → on s'adapte)
 var arr = Array.isArray(d) ? d : (d.data||d.rows||d.items||[]);
 if(!arr || !arr.length) return null;
 var n=arr.length, ca=0, cout=0, marge=0, faibles=[];
 arr.forEach(function(o){
   var t = Number(o.total||o.ca||o.montant||o.prix||0);
   var c = Number(o.cout||o.coutRevient||o.cost||o.coutTotal||0);
   var m = (o.marge!=null)?Number(o.marge):(t-c);
   ca+=t; cout+=c; marge+=m;
   var tx = t>0?Math.round(m/t*100):0;
   if(t>0 && tx<20) faibles.push((o.client||o.ref||'?')+' ('+tx+'%)');
 });
 var txGlobal = ca>0?Math.round(marge/ca*100):0;
 return '✅ <b>Analyse de ta page /dispatch</b> ('+n+' lignes lues en direct) :<br><br>'+
  '• CA analysé : <b>'+fmt(ca)+'</b><br>'+
  (cout>0?'• Coût de revient total : '+fmt(cout)+'<br>':'')+
  '• Marge totale : <span class="g">'+fmt(marge)+'</span> ('+txGlobal+'%)<br>'+
  (faibles.length?'• <span class="r">⚠️ '+faibles.length+' commandes peu rentables (&lt;20%)</span> : '+faibles.slice(0,5).join(', '):'• <span class="g">Aucune commande sous 20% de marge 👍</span>')+
  '<br><br><span style="color:var(--mut2)">Analyse refaite automatiquement chaque jour.</span>';
}
function analyseRenta(force){
 var out=document.getElementById('rentaOut'); if(!out)return;
 var dejaFait = !force && localStorage.getItem(aujKey());
 out.innerHTML='⏳ Connexion à ta page /dispatch…';
 var finished=false;
 var to=setTimeout(function(){if(finished)return;finished=true;out.innerHTML=rentaLocale();},6000);
 try{
  fetch('/api/rentabilite').then(function(r){return r.json();}).then(function(j){
   if(finished)return;finished=true;clearTimeout(to);
   if(j&&j.ok&&j.data){var html=rentaFromDispatch(j.data); out.innerHTML=html||rentaLocale();}
   else out.innerHTML=rentaLocale();
   localStorage.setItem(aujKey(),'1');
  }).catch(function(){if(finished)return;finished=true;clearTimeout(to);out.innerHTML=rentaLocale();});
 }catch(e){if(!finished){finished=true;clearTimeout(to);out.innerHTML=rentaLocale();}}
 // Notifie le Patron IA dans le salon (1x par jour)
 if(force || !dejaFait){ setTimeout(function(){
   if(window.__manual)return;
   try{
    var t=team['Patron IA'];var el=document.createElement('div');el.className='msg boss';
    el.innerHTML='<div class="av" style="background:'+t.c+'22">📈</div><div class="bubble"><div class="ordre">RENTABILITÉ</div><div class="who"><b>Agent Rentabilité</b></div><div class="txt">J\'ai analysé la page /dispatch aujourd\'hui. Bilan dispo dans mon onglet. 📊</div></div>';
    feed.appendChild(el);feed.scrollTop=feed.scrollHeight;
   }catch(e){}
 },1500); }
}

show('overview');
step();

/* ===== SALON — tourne en permanence (indépendant du centre) ===== */
var team={'Patron IA':{em:'🧠',c:'#C4714F'},'Le Veilleur':{em:'⚠️',c:'#E74C3C'},'Finance':{em:'💰',c:'#EAB308'},'Production':{em:'🏭',c:'#3b82f6'},'Coût de revient':{em:'🧮',c:'#34d399'},'Achats':{em:'📦',c:'#a78bfa'},'Planning':{em:'📅',c:'#06b6d4'},'Commercial':{em:'👥',c:'#e69a76'},'Marketing':{em:'📣',c:'#f59e0b'},'Service client':{em:'💬',c:'#60a5fa'}};
function build(cy){
 var i1=pick(APP.finance,cy),i2=pick(APP.finance,cy+1),gr=pick(APP.gros,cy),pe=pick(APP.production,cy),ar=pick(APP.topArt,cy),vt=APP.vendeurs[0]||{v:'—'};
 return [
  {a:'Patron IA',boss:1,o:'BRIEFING',m:'Analyse — '+num(APP.stats.total)+' commandes. Encaissé <span class="r">'+APP.fmt.paye+'</span> sur '+APP.fmt.ca+'. Vos points.'},
  {a:'Finance',m:'Plus gros impayé : <span class="r">'+esc(i1.client)+' — '+fmt(i1.reste)+'</span> (vente '+esc(i1.vendeur)+'). Total dû '+APP.fmt.reste+'.'},
  {a:'Production',m:'<span class="k">'+APP.stats.enAttente+' en attente</span>. La plus vieille : '+esc(pe.client)+' ('+esc(pe.date)+').'},
  {a:'Patron IA',boss:1,o:'ORDRE',m:'Finance → relance <span class="k">'+esc(i1.client)+'</span> puis '+esc(i2.client)+'. Production → lance '+esc(pe.client)+'.'},
  {a:'Coût de revient',m:'Je valide la marge de <span class="k">'+esc(gr.client)+'</span> ('+fmt(gr.total)+') avant lancement.'},
  {a:'Achats',m:'Best-seller à approvisionner : '+esc(ar.nom)+'. Je compare 2 fournisseurs, j\'économise.'},
  {a:'Commercial',m:'Top vente : <span class="k">'+esc(vt.v)+'</span> '+fmt(vt.ca)+' mais '+fmt(vt.reste)+' d\'impayés à serrer.'},
  {a:'Marketing',m:'Je pousse <span class="k">'+esc(ar.nom)+'</span> en pub pour remplir le carnet.'},
  {a:'Patron IA',boss:1,you:1,m:'Driss : <span class="k">'+esc(i1.client)+'</span> ('+fmt(i1.reste)+') demande un délai. Échéancier 3x ?'}
 ];
}
var feed=document.getElementById('feed'),cycle=0,script=build(0),i=0;
function bubble(it){var t=team[it.a]||{em:'•',c:'#888'};var el=document.createElement('div');el.className='msg'+(it.boss?' boss':'')+(it.you?' you':'');
 el.innerHTML='<div class="av" style="background:'+t.c+'22">'+t.em+'</div><div class="bubble">'+(it.o?'<div class="ordre">'+it.o+'</div>':'')+'<div class="who"><b>'+it.a+'</b></div><div class="txt">'+it.m+'</div>'+(it.you?'<div class="btns"><span class="btn y">✓ Échéancier 3x</span><span class="btn">Remise</span><span class="btn">Je gère</span></div>':'')+'</div>';
 feed.appendChild(el);feed.scrollTop=feed.scrollHeight;}
function typing(it,cb){var t=team[it.a]||{em:'•',c:'#888'};var el=document.createElement('div');el.className='typing';
 el.innerHTML='<div class="av" style="background:'+t.c+'22">'+t.em+'</div><div class="tdots"><i></i><i></i><i></i></div>';
 feed.appendChild(el);feed.scrollTop=feed.scrollHeight;setTimeout(function(){if(el.parentNode)feed.removeChild(el);bubble(it);cb&&cb();},it.boss?850:620);}
function step(){if(window.__manual)return;if(i>=script.length){setTimeout(function(){if(window.__manual)return;feed.innerHTML='';cycle++;script=build(cycle);i=0;step();},5000);return;}var it=script[i++];typing(it,function(){setTimeout(step,900);});}

/* ===== TOI ↔ PATRON IA : questions & missions ===== */
team['Toi']={em:'👑',c:'#22C55E'};
function sayUser(txt){var t=team['Toi'];var el=document.createElement('div');el.className='msg you';
 el.innerHTML='<div class="av" style="background:'+t.c+'22">'+t.em+'</div><div class="bubble"><div class="who"><b>Toi (Driss)</b></div><div class="txt">'+esc(txt)+'</div></div>';
 feed.appendChild(el);feed.scrollTop=feed.scrollHeight;}
function sayBoss(html){var t=team['Patron IA'];var el=document.createElement('div');el.className='msg boss';
 el.innerHTML='<div class="av" style="background:'+t.c+'22">'+t.em+'</div><div class="bubble"><div class="who"><b>Patron IA</b></div><div class="txt">'+html+'</div></div>';
 feed.appendChild(el);feed.scrollTop=feed.scrollHeight;}
function bossThinking(cb){var t=team['Patron IA'];var el=document.createElement('div');el.className='typing';
 el.innerHTML='<div class="av" style="background:'+t.c+'22">'+t.em+'</div><div class="tdots"><i></i><i></i><i></i></div>';
 feed.appendChild(el);feed.scrollTop=feed.scrollHeight;return function(html){if(el.parentNode)feed.removeChild(el);sayBoss(html);};}

var SYS = "Tu es le Patron IA de CreaJit (fabricant de meubles à Marrakech), le directeur général virtuel de Driss. Réponds en français, court, concret, comme un bras droit fiable. Tu reçois des questions ET des missions. Quand c'est une mission, confirme que tu la répartis à l'agent concerné (Finance, Production, Achats, Livraison, Commercial, Marketing...) et décris l'action en 1-2 lignes. N'invente jamais un chiffre. Données réelles:\n"
 +"- "+num(APP.stats.total)+" commandes, CA "+APP.fmt.ca+", encaissé "+APP.fmt.paye+" ("+APP.raw.tauxEnc+"%), reste dû "+APP.fmt.reste+" sur "+APP.stats.impayes+" impayés.\n"
 +"- Production: "+APP.stats.enAttente+" en attente, "+APP.stats.enFab+" en cours, "+APP.stats.termine+" terminées. Livraison: "+APP.stats.aLivrer+" à livrer, 0 retard.\n"
 +"- Top impayés: "+APP.finance.slice(0,8).map(function(o){return o.client+' '+fmt(o.reste);}).join('; ')+".\n"
 +"- Commerciaux: "+APP.vendeurs.map(function(v){return v.v+' CA '+fmt(v.ca)+' (reste '+fmt(v.reste)+')';}).join('; ')+".\n"
 +"- 39 salariés, masse "+APP.fmt.masse+"/mois, 9 ateliers, 559 matières.";

function localAnswer(q){
 var s=q.toLowerCase();
 function impList(n){return APP.finance.slice(0,n).map(function(o,i){return '<b>'+(i+1)+'.</b> '+esc(o.client)+' — <span class="r">'+fmt(o.reste)+'</span> <span style="color:var(--mut2)">('+esc(o.vendeur)+')</span>';}).join('<br>');}
 // mission ?
 if(/relanc|lance|envoi|prépar|prepar|appel|contact|achèt|achet|mission|fais |faire |pousse|publi|programme/.test(s)){
   var who='l\'agent concerné';
   if(/impay|relanc|encaiss|client.*doit|paiement/.test(s))who='💰 Finance';
   else if(/lance|fabriqu|produc|atelier/.test(s))who='🏭 Production';
   else if(/achèt|achet|fournisseur|matier|matière|appro/.test(s))who='📦 Achats';
   else if(/livr/.test(s))who='🚚 Livraison';
   else if(/pub|post|market|insta|facebook|promo/.test(s))who='📣 Marketing';
   else if(/devis|client|vente|prospect/.test(s))who='👥 Commercial';
   return '✅ <b>Mission notée</b>, Driss. Je la confie à <b>'+who+'</b> et je te fais un retour dès que c\'est traité.<br><span style="color:var(--mut2)">(Pour exécuter pour de vrai — envoi WhatsApp/mail — il faut activer mon cerveau Claude en ligne.)</span>';
 }
 if(/bonjour|salut|coucou|ça va|cava|hello/.test(s)) return 'Bonjour Driss 👋 Je surveille tes '+num(APP.stats.total)+' commandes. Demande-moi les impayés, le reste à encaisser, quoi lancer, un commercial, un salarié…';
 if(/doit le plus|qui.*doit|impay|créanc|crenc|gros.*dû|dette/.test(s)) return 'Tes plus gros impayés :<br>'+impList(5)+'<br><br>Total à récupérer : <span class="r">'+APP.fmt.reste+'</span> sur '+APP.stats.impayes+' commandes.';
 if(/encaiss|trésor|tresor|caisse|cash|liquid/.test(s)) return 'CA total : <b>'+APP.fmt.ca+'</b>. Encaissé : <span class="g">'+APP.fmt.paye+'</span> ('+APP.raw.tauxEnc+'%). <br>Reste à encaisser : <span class="r">'+APP.fmt.reste+'</span> sur '+APP.stats.impayes+' commandes. C\'est la priorité.';
 if(/lancer|à lancer|attente|à faire|produc|fabriqu|en cours/.test(s)){var p=APP.production.slice(0,5).map(function(o){return '• '+esc(o.client)+' ('+esc(o.date)+', '+fmt(o.total)+')';}).join('<br>');return '<b>'+APP.stats.enAttente+'</b> commandes en attente. Les plus anciennes à lancer :<br>'+p;}
 if(/livr/.test(s)){var l=APP.livraison.slice(0,5).map(function(o){return '• '+esc(o.client)+' — '+fmt(o.total)+' ('+esc(o.etat)+')';}).join('<br>');return '<b>'+APP.stats.aLivrer+'</b> à livrer, 0 en retard. Les plus grosses :<br>'+l;}
 if(/vendeur|commercial|vente|ikram|kenza|laila|fatima/.test(s)){
   var v=APP.vendeurs.filter(function(x){return s.indexOf(x.v.toLowerCase())>=0;})[0];
   if(v)return '<b>'+esc(v.v)+'</b> : '+v.nb+' commandes, CA '+fmt(v.ca)+', encaissé <span class="g">'+fmt(v.enc)+'</span>, reste <span class="r">'+fmt(v.reste)+'</span>.';
   return 'Performance commerciale :<br>'+APP.vendeurs.slice(0,4).map(function(x){return '• <b>'+esc(x.v)+'</b> — '+fmt(x.ca)+' ('+x.nb+' cmd, reste '+fmt(x.reste)+')';}).join('<br>');
 }
 if(/stock|matier|matière|fournisseur|appro/.test(s)) return 'Catalogue : <b>'+num(APP.stats.matieres)+' matières</b> chez '+APP.fournisseurs.length+'+ fournisseurs. Top fournisseurs : '+APP.fournisseurs.slice(0,3).map(function(f){return esc(f.f)+' ('+f.n+')';}).join(', ')+'. Article le plus commandé : '+esc((APP.topArt[0]||{}).nom)+'.';
 if(/salaire|salari|masse|paie|employ|effectif|équipe|equipe/.test(s)){
   var emp=APP.salaries.filter(function(e){return e.n&&s.indexOf(e.n.toLowerCase().split(' ')[0])>=0;})[0];
   if(emp)return '<b>'+esc(emp.n)+'</b> — '+esc(emp.poste)+' (atelier '+esc(emp.atelier)+'). Salaire '+fmt(emp.sal)+', coût/h '+emp.coutH+'.';
   return '<b>39 salariés</b>, masse salariale <b>'+APP.fmt.masse+'/mois</b>, répartis sur 9 ateliers.';
 }
 if(/atelier/.test(s)) return '9 ateliers : '+APP.ateliers.slice(0,5).map(function(a){return esc(a.nom)+' ('+a.effectif+' pers., '+a.coutH+' DH/h)';}).join('; ')+'…';
 if(/marge|rentab|bénéf|benef|coût de revient|cout de revient/.test(s)) return 'Panier moyen : <b>'+APP.fmt.panier+'</b>/commande. CA potentiel '+APP.fmt.ca+' vs masse salariale '+APP.fmt.masse+'/mois. Marge précise par commande = à brancher (coût matière+main d\'œuvre).';
 // recherche d'un client
 var toks=s.split(/[^a-zàâçéèêëîïôûùü]+/).filter(function(w){return w.length>=4;});
 var hit=APP.finance.concat(APP.gros).filter(function(o){return toks.some(function(t){return (o.client||'').toLowerCase().indexOf(t)>=0;});})[0];
 if(hit)return 'Client <b>'+esc(hit.client)+'</b> : commande '+fmt(hit.total)+(hit.reste!=null?', reste dû <span class="r">'+fmt(hit.reste)+'</span>':'')+' (vente '+esc(hit.vendeur)+').';
 return 'Bonne question. Mon cerveau Claude complet s\'active une fois l\'app en ligne (avec ta clé API). En attendant je réponds sur tes données : essaie « qui me doit le plus », « reste à encaisser », « quoi lancer », un nom de client, un commercial, un salarié, le stock…';
}

function ask(q){document.getElementById('qinput').value=q;send();}
function send(){
 var inp=document.getElementById('qinput');var q=(inp.value||'').trim();if(!q)return;inp.value='';
 if(!window.__manual){window.__manual=true;feed.innerHTML='';
   sayBoss('Je t\'écoute, Driss. Pose ta question ou donne-moi une mission. 👇');}
 sayUser(q);
 var done=bossThinking();
 var finished=false;
 var to=setTimeout(function(){if(!finished){finished=true;done(localAnswer(q));}},15000);
 try{
  fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:SYS,model:'claude-sonnet-4-6',messages:[{role:'user',content:q}]})})
   .then(function(r){return r.json();})
   .then(function(d){if(finished)return;finished=true;clearTimeout(to);
     var t=(d&&d.content&&d.content[0]&&d.content[0].text)?d.content[0].text:((d&&d.text)?d.text:null);
     done(t?esc(t).replace(/\n/g,'<br>'):localAnswer(q));})
   .catch(function(){if(finished)return;finished=true;clearTimeout(to);done(localAnswer(q));});
 }catch(e){if(!finished){finished=true;clearTimeout(to);done(localAnswer(q));}}
}

show('overview');
step();
