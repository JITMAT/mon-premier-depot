<style>
  :root{--bg:#0d111b;--card:#161d2b;--card2:#10151f;--line:rgba(196,113,79,.18);--orange:#C4714F;--orange-b:#e69a76;--green:#37c98a;--red:#E74C3C;--yellow:#EAB308;--ink:#ece9e3;--mut:#8d96a5}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',sans-serif;padding:24px 18px 80px}
  .wrap{max-width:880px;margin:0 auto}
  .head{display:flex;align-items:center;gap:13px;margin-bottom:18px}
  .av0{width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,#3b82f6,#1e3a8a);display:grid;place-items:center;font-family:'Fraunces';font-weight:700;font-size:18px;color:#fff}
  h1{font-family:'Fraunces';font-weight:700;font-size:20px}
  .sub{font-size:12px;color:var(--mut)}
  .bon{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px}
  .bon.recu{opacity:.6}
  .bon .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .bon .cli{font-weight:700;font-size:15px}
  .bon .meta{font-size:12px;color:var(--mut);margin:3px 0 9px}
  .lignes{font-size:13px;margin-bottom:10px}.lignes div{padding:3px 0;border-top:1px solid var(--line)}
  .badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700}
  .b-com{background:rgba(196,113,79,.18);color:var(--orange-b)}.b-recu{background:rgba(55,201,138,.16);color:var(--green)}
  .chrono{font-family:'Fraunces';font-weight:700;color:var(--orange-b)}
  button{font-family:inherit;cursor:pointer}
  .act{background:var(--green);color:#06210f;border:none;border-radius:9px;padding:10px 16px;font-weight:700;font-size:14px}
  .empty{color:var(--mut);text-align:center;padding:30px;border:1px dashed var(--line);border-radius:13px}
</style>

<div class="wrap">
  <div class="head"><div class="av0">H</div><div><h1>Réception — Hassan</h1><div class="sub">Marchandise reçue → la commande passe au vert chez Mohamed, Hanane et l'ouvrier</div></div></div>
  <div id="bons"></div>
</div>

<script>
(function(){
  function depuis(t0,t1){ if(!t0) return ''; var m=Math.floor(((t1||Date.now())-t0)/60000); return m<60?(m+' min'):(Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')); }
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function render(){
    if(!window.CJ) return;
    var bons=CJ.bons().filter(b=>b.statut==='commande'||b.statut==='recu');
    var box=document.getElementById('bons');
    if(!bons.length){ box.innerHTML='<div class="empty">Rien à réceptionner pour l\'instant.<br>Les bons traités par Mohamed apparaissent ici.</div>'; return; }
    box.innerHTML=bons.map(function(b){
      var lignes=(b.lignes||[]).map(l=>`<div>${esc(l.nom)} — <b>${l.qty||1}</b> ${esc(l.unite||'')} <span style="color:var(--mut)">· ${esc(l.fournisseur||'')}</span></div>`).join('');
      var act=b.statut==='recu'?`<span class="sub" style="color:var(--green)">✅ Reçu en ${depuis(b.t0,b.tRecu)}</span>`:`<button class="act" data-id="${b.id}">✅ Marchandise reçue</button>`;
      return `<div class="bon ${b.statut==='recu'?'recu':''}"><div class="t"><div class="cli">${esc(b.client||'—')} <span class="sub">· ${esc(b.ref||'')}</span></div>
        <div style="display:flex;gap:8px;align-items:center"><span class="badge ${b.statut==='recu'?'b-recu':'b-com'}">${b.statut==='recu'?'✅ Reçu':('🛒 '+(b.mode||'en cours'))}</span><span class="chrono">⏱️ ${depuis(b.t0,b.tRecu)}</span></div></div>
        <div class="meta">${esc(b.mode||'')} · ${(b.lignes||[]).length} ligne(s)</div><div class="lignes">${lignes}</div>${act}</div>`;
    }).join('');
    box.querySelectorAll('[data-id]').forEach(function(btn){ btn.onclick=function(){
      var id=btn.getAttribute('data-id'); CJ.majBon(id,{statut:'recu',tRecu:Date.now()});
      var b=CJ.etat().bons[id];
      CJ.evenement('success','Hassan (réception)',`Hassan a réceptionné la matière pour ${b.client} (${b.ref}). Bon au VERT.`,'→ Mohamed + Hanane + ouvrier');
      render();
    };});
  }
  window.addEventListener('load',render);
  if(window.CJ) CJ.abonner(render);
  setInterval(render,30000);
})();
</script>
